<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Game name: "Matrix Maze" - if changing, update src/constants.js -->
    <title>Matrix Maze</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16">
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div id="app">
        <div id="level-indicator">Level 1</div>
        <div id="viewport"></div>
        <div id="controls">
            <p>WASD move · Mouse or Q/E turn · Space next · R replay</p>
        </div>
    </div>
    <aside id="finish-plate" hidden>
        <p class="plate-kicker">Run complete</p>
        <p class="plate-time" id="finish-time">--:--.--</p>
        <form id="name-form">
            <label for="display-name">Your name</label>
            <input id="display-name" name="display-name" maxlength="16" autocomplete="nickname" required>
            <button type="submit">Submit time</button>
            <p class="plate-error" id="plate-error"></p>
        </form>
        <div id="board-wrap" hidden>
            <div class="board-toolbar">
                <h2>Hiscores</h2>
                <div class="hiscore-filters" id="board-filter" role="tablist" aria-label="Hiscore view">
                    <button type="button" data-filter="run" class="is-on" aria-selected="true">Full run</button>
                    <button type="button" data-filter="1" aria-selected="false">L1</button>
                    <button type="button" data-filter="2" aria-selected="false">L2</button>
                    <button type="button" data-filter="3" aria-selected="false">L3</button>
                    <button type="button" data-filter="4" aria-selected="false">L4</button>
                    <button type="button" data-filter="5" aria-selected="false">L5</button>
                    <button type="button" data-filter="6" aria-selected="false">L6</button>
                    <button type="button" data-filter="7" aria-selected="false">L7</button>
                    <button type="button" data-filter="8" aria-selected="false">L8</button>
                </div>
            </div>
            <ol id="board-list"></ol>
            <button type="button" id="play-again">Play again</button>
        </div>
        <div id="profile-wrap" hidden>
            <button type="button" class="profile-back" id="profile-back">Hiscores</button>
            <h2 id="profile-name">Player</h2>
            <p class="profile-stat" id="profile-overall"></p>
            <p class="profile-stat" id="profile-moving"></p>
            <ol id="profile-levels"></ol>
        </div>
    </aside>
    <div id="touch-controls" aria-hidden="true">
        <!-- Bottom-left: movement laid out like keyboard arrow keys (forward/back + strafe) -->
        <div class="touch-cluster touch-move">
            <button type="button" class="touch-btn move-forward" data-key="w" aria-label="Move forward">&#9650;</button>
            <button type="button" class="touch-btn move-left" data-key="a" aria-label="Strafe left">&#9664;</button>
            <button type="button" class="touch-btn move-back" data-key="s" aria-label="Move backward">&#9660;</button>
            <button type="button" class="touch-btn move-right" data-key="d" aria-label="Strafe right">&#9654;</button>
        </div>
        <!-- Bottom-right: turn/rotate view left and right -->
        <div class="touch-cluster touch-turn">
            <button type="button" class="touch-btn turn-left" data-key="q" aria-label="Turn left">&#9664;</button>
            <button type="button" class="touch-btn turn-right" data-key="e" aria-label="Turn right">&#9654;</button>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
